<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pikmin Bloom 蘑菇計時器</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="皮克敏計時器">
    
    <!-- 核心優化：內嵌向量 SVG 作為圖示 -->
    <script>
        const MUSHROOM_SVG = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M15,55 Q15,15 50,15 Q85,15 85,55 L15,55' fill='%23ff4444'/%3E%3Ccircle cx='32' cy='30' r='6' fill='white'/%3E%3Ccircle cx='50' cy='42' r='5' fill='white'/%3E%3Ccircle cx='68' cy='30' r='6' fill='white'/%3E%3Crect x='40' y='55' width='20' height='30' rx='8' fill='%23fff5e6'/%3E%3C/svg%3E`;
        document.write(`<link rel="icon" href="${MUSHROOM_SVG}">`);
        document.write(`<link rel="apple-touch-icon" href="${MUSHROOM_SVG}">`);
    </script>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: linear-gradient(135deg, #e0f2fe 0%, #f0fdfa 100%); min-height: 100vh; }
        [v-cloak] { display: none; }
        .card-shadow { box-shadow: 0 10px 30px -10px rgba(7, 89, 133, 0.15); }
        @keyframes tick-ripple {
            0% { transform: scale(1); background-color: rgba(38, 209, 194, 0.4); }
            100% { transform: scale(1.05); background-color: white; }
        }
        .animate-ripple { animation: tick-ripple 0.5s ease-out forwards; }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        @supports (padding: env(safe-area-inset-top)) {
            .safe-pt { padding-top: env(safe-area-inset-top); }
            .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
        }
    </style>
</head>
<body class="safe-pb text-slate-900 text-left relative">
    <div id="app" v-cloak class="max-w-md mx-auto p-5 safe-pt">
        
        <!-- Header -->
        <header class="mb-6 text-left">
            <h1 class="text-2xl font-900 text-blue-900 mb-4 flex items-center gap-2">
                <img :src="iconSvg" class="w-10 h-10"> 
                Pikmin Bloom 蘑菇計時器
            </h1>
            
            <div class="bg-white/80 backdrop-blur-md rounded-3xl p-5 border border-blue-100 shadow-sm space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex flex-col text-left">
                        <span class="text-[11px] font-black text-blue-800/50 uppercase tracking-widest leading-none mb-1">目前系統時間</span>
                        <span class="text-2xl font-mono font-900 text-blue-900 leading-none">{{ currentTimeDisplay }}</span>
                    </div>
                    <div class="flex gap-2">
                        <button @click="testNotification" class="bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-[10px] font-black uppercase">測試</button>
                        <button @click="requestPermission" 
                            :class="permissionStatus === 'granted' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-blue-600 text-white shadow-md shadow-blue-200'"
                            class="px-4 py-2 rounded-xl text-xs font-black transition-all border">
                            {{ permissionStatus === 'granted' ? '已開啟' : '開啟通知' }}
                        </button>
                    </div>
                </div>

                <div class="pt-4 border-t border-blue-50 flex items-center justify-between">
                    <div class="flex flex-col text-left">
                        <span class="text-[11px] font-black text-teal-700 uppercase tracking-widest">地圖刷新週期 (秒)</span>
                        <p class="text-[10px] text-slate-400 font-bold">對齊遊戲週期秒數</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <input :value="globalTick" @input="handleTickInput" @blur="handleTickBlur" type="number" 
                            class="w-16 bg-blue-50 border-2 border-blue-100 rounded-xl px-2 py-2 text-center font-900 text-blue-900 outline-none focus:border-teal-400">
                        <span class="font-bold text-blue-900 text-sm">秒</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Form Section -->
        <section class="bg-white rounded-[2.5rem] p-6 mb-8 card-shadow border border-blue-100 text-left">
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-900 text-blue-900 mb-2 ml-1 uppercase tracking-wider">蘑菇地點</label>
                    <input v-model="form.name" type="text" placeholder="例如：大安紅菇..." class="w-full border-2 border-blue-50 bg-blue-50/50 rounded-2xl px-4 py-3.5 focus:ring-4 focus:ring-blue-100 outline-none font-bold text-blue-900 transition-all">
                </div>
                
                <div class="flex gap-4 text-left">
                    <div class="flex-1">
                        <label class="block text-sm font-900 text-blue-900 mb-2 ml-1">戰鬥分</label>
                        <input v-model.number="form.min" type="number" class="w-full border-2 border-blue-50 bg-blue-50/50 rounded-2xl px-4 py-3.5 outline-none font-900 text-blue-900">
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-900 text-blue-900 mb-2 ml-1">戰鬥秒</label>
                        <input v-model.number="form.sec" type="number" class="w-full border-2 border-blue-50 bg-blue-50/50 rounded-2xl px-4 py-3.5 outline-none font-900 text-blue-900">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 text-left">
                    <div class="bg-teal-50/40 p-3 rounded-2xl border border-teal-50">
                        <label class="block text-[10px] font-900 text-teal-800 uppercase mb-1 ml-1">重生冷卻 (秒)</label>
                        <input v-model.number="form.respawnDuration" type="number" class="w-full bg-white border-2 border-teal-100 rounded-xl px-2 py-2 text-center font-900 text-teal-900 outline-none">
                    </div>
                    <div class="bg-blue-50/40 p-3 rounded-2xl border border-blue-50">
                        <label class="block text-[10px] font-900 text-blue-800 uppercase mb-1 ml-1">提前通知 (秒)</label>
                        <input v-model.number="form.advance" type="number" class="w-full bg-white border-2 border-blue-100 rounded-xl px-2 py-2 text-center font-900 text-blue-900 outline-none">
                    </div>
                </div>

                <button @click="addMushroom" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-900 py-4 rounded-2xl transition-all shadow-lg text-lg tracking-widest active:scale-95 transform">加入監視</button>
            </div>
        </section>

        <!-- Timer List -->
        <div class="space-y-4">
            <transition-group name="list" tag="div" class="space-y-4">
                <div v-for="m in sortedMushrooms" :key="m.id" 
                    :class="m.phase === 2 ? 'border-teal-200 bg-white ring-2 ring-teal-500/10' : 'border-blue-100 bg-white/80'"
                    class="rounded-[2.5rem] p-6 border-2 card-shadow relative overflow-hidden transition-all duration-500 text-left">
                    
                    <div class="flex justify-between items-start relative z-10">
                        <div>
                            <h3 class="font-900 text-blue-950 text-xl leading-tight">{{ m.name || '未命名' }}</h3>
                            <span :class="m.phase === 2 ? 'bg-teal-500 shadow-md shadow-teal-100' : 'bg-blue-500'" class="inline-block mt-2 text-white text-[10px] px-3 py-1 rounded-full uppercase font-black">
                                {{ m.phase === 1 ? '⚔️ 戰鬥中' : '✨ 重生中' }}
                            </span>
                        </div>
                        <button @click="deleteMushroom(m.id)" class="text-slate-300 hover:text-red-500 p-2 transition-colors"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg></button>
                    </div>

                    <div class="flex items-baseline gap-2 mb-5 relative z-10 mt-3">
                        <span class="text-5xl font-900 tabular-nums tracking-tighter" :class="m.phase === 2 ? 'text-teal-600 font-black' : 'text-blue-600'">{{ m.displayTime }}</span>
                        <span class="text-sm font-900 text-slate-400 uppercase tracking-tighter">{{ m.phase === 1 ? '後結束' : '後重生' }}</span>
                    </div>

                    <div v-if="m.phase === 2 && !m.isExpired" class="bg-teal-50 rounded-3xl p-4 border border-teal-100 relative z-10 shadow-inner">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="flex h-2 w-2 rounded-full bg-teal-500 animate-pulse"></span>
                            <span class="text-[10px] font-black text-teal-800 uppercase tracking-widest">地圖刷新點 ({{ globalTick }}s)</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3 font-mono font-900 text-teal-800 text-center">
                            <div :key="m.nextTick" class="bg-white p-3 rounded-2xl text-base border border-teal-100 shadow-sm animate-ripple">
                                {{ m.nextTick }}
                            </div>
                            <div class="bg-white/50 p-3 rounded-2xl text-base border border-teal-50 text-slate-400">
                                {{ m.nextNextTick }}
                            </div>
                        </div>
                    </div>

                    <div class="absolute bottom-0 left-0 h-2.5 bg-slate-50 w-full overflow-hidden">
                        <div :class="m.phase === 2 ? 'bg-teal-500' : 'bg-blue-500'" class="h-full transition-all duration-1000 shadow-sm" :style="{ width: m.progress + '%' }"></div>
                    </div>

                    <div v-if="m.isExpired" class="absolute inset-0 bg-white/95 backdrop-blur-md flex flex-col items-center justify-center z-20">
                        <div class="bg-white p-6 rounded-3xl shadow-xl border border-teal-100 flex flex-col items-center">
                            <img :src="iconSvg" class="w-16 h-16 mb-2">
                            <p class="text-teal-700 font-900 text-xl">重生完成！</p>
                            <button @click="deleteMushroom(m.id)" class="mt-4 text-sm font-900 bg-blue-600 text-white px-8 py-3 rounded-2xl shadow-lg active:scale-95 transition-transform">移除紀錄</button>
                        </div>
                    </div>
                </div>
            </transition-group>
            
            <div v-if="mushrooms.length === 0" class="text-center py-16 bg-white/30 rounded-[3rem] border-2 border-dashed border-blue-200">
                <img :src="iconSvg" class="w-16 h-16 mx-auto mb-4 opacity-20 grayscale">
                <p class="text-blue-900/30 font-900 tracking-widest uppercase text-sm">等待計時...</p>
            </div>
        </div>

        <!-- 浮動版號顯示：固定於右下角 -->
        <div class="fixed bottom-2 right-4 text-[10px] font-black text-blue-900/20 pointer-events-none tracking-widest safe-pb">
            VER 16.0
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const mushrooms = ref([]);
                const permissionStatus = ref('default');
                const currentTime = ref(new Date());
                const globalTick = ref(8);
                const form = ref({ name: '', min: 0, sec: 0, notify: true, advance: 30, respawnDuration: 300 });

                const iconSvg = MUSHROOM_SVG;

                const currentTimeDisplay = computed(() => {
                    const d = currentTime.value;
                    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
                });

                const handleTickInput = (e) => {
                    const val = e.target.value;
                    if (val === '') return;
                    const num = parseInt(val);
                    if (!isNaN(num) && num > 0) {
                        globalTick.value = num;
                        localStorage.setItem('pikmin_global_tick', num);
                    }
                };

                const handleTickBlur = (e) => {
                    if (e.target.value === '' || parseInt(e.target.value) <= 0) {
                        const saved = localStorage.getItem('pikmin_global_tick');
                        globalTick.value = saved ? parseInt(saved) : 8;
                        e.target.value = globalTick.value;
                    }
                };

                const requestPermission = async () => {
                    if ('Notification' in window) {
                        const result = await Notification.requestPermission();
                        permissionStatus.value = result;
                    }
                };

                const sendNotification = (title, body) => {
                    if ('Notification' in window && Notification.permission === 'granted') {
                        navigator.serviceWorker.ready.then(reg => {
                            reg.showNotification(title, {
                                body,
                                icon: iconSvg,
                                vibrate: [200, 100, 200]
                            });
                        });
                    }
                };

                const testNotification = () => sendNotification("測試通知", "通知系統正常運作中 🍄");

                const addMushroom = () => {
                    const battleDurationMs = (form.value.min * 60 + form.value.sec) * 1000;
                    if (battleDurationMs <= 0 && !form.value.name) return;
                    const now = Date.now();
                    const respawnMs = (form.value.respawnDuration || 300) * 1000;
                    mushrooms.value.push({
                        id: now, name: form.value.name || '未命名',
                        battleEndTime: now + battleDurationMs,
                        respawnEndTime: now + battleDurationMs + respawnMs,
                        respawnDuration: form.value.respawnDuration || 300,
                        advanceSeconds: form.value.advance || 30,
                        notify: form.value.notify,
                        battleNotified: false, respawnNotified: false,
                        phase: 1, isExpired: false, displayTime: '', progress: 0, nextTick: '', nextNextTick: ''
                    });
                    saveData();
                    form.value.name = ''; form.value.min = 0; form.value.sec = 0;
                };

                const deleteMushroom = (id) => {
                    mushrooms.value = mushrooms.value.filter(m => m.id !== id);
                    saveData();
                };

                const saveData = () => localStorage.setItem('pikmin_v16', JSON.stringify(mushrooms.value));

                const sortedMushrooms = computed(() => {
                    return [...mushrooms.value].sort((a, b) => {
                        if (a.isExpired !== b.isExpired) return a.isExpired ? 1 : -1;
                        if (a.phase !== b.phase) return b.phase - a.phase;
                        const at = a.phase === 1 ? a.battleEndTime : a.respawnEndTime;
                        const bt = b.phase === 1 ? b.battleEndTime : b.respawnEndTime;
                        return at - bt;
                    });
                });

                const formatTs = (ts) => {
                    const d = new Date(ts);
                    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
                };

                const formatTime = (ms) => {
                    const s = Math.max(0, Math.floor(ms / 1000));
                    return `${String(Math.floor(s/60)).padStart(2, '0')}:${String(s%60).padStart(2, '0')}`;
                };

                const updateTimers = () => {
                    const now = Date.now();
                    currentTime.value = new Date();
                    const cycleMs = (globalTick.value || 8) * 1000;
                    mushrooms.value.forEach(m => {
                        if (now < m.battleEndTime) {
                            m.phase = 1;
                            const diff = m.battleEndTime - now;
                            m.displayTime = formatTime(diff);
                            m.progress = (diff / (m.battleEndTime - m.id)) * 100;
                            if (m.notify && !m.battleNotified && diff < 1000) {
                                sendNotification(`⚔️ 戰鬥結束`, `${m.name} 已進入重生倒數`);
                                m.battleNotified = true;
                            }
                        } else if (now < m.respawnEndTime) {
                            m.phase = 2;
                            const diff = m.respawnEndTime - now;
                            m.displayTime = formatTime(diff);
                            const totalRespawnMs = (m.respawnDuration || 300) * 1000;
                            m.progress = (diff / totalRespawnMs) * 100;
                            let nextTickTs = now + (diff % cycleMs);
                            if (nextTickTs <= now) nextTickTs += cycleMs;
                            m.nextTick = formatTs(nextTickTs);
                            m.nextNextTick = formatTs(nextTickTs + cycleMs);
                            const advanceMs = (m.advanceSeconds || 30) * 1000;
                            if (m.notify && !m.respawnNotified && diff <= advanceMs) {
                                sendNotification(`🍄 重生預警`, `${m.name} 將在 ${m.advanceSeconds} 秒後重生！`);
                                m.respawnNotified = true;
                            }
                        } else {
                            m.isExpired = true;
                            m.displayTime = "00:00"; m.progress = 0;
                        }
                    });
                };

                onMounted(() => {
                    const saved = localStorage.getItem('pikmin_v16');
                    if (saved) mushrooms.value = JSON.parse(saved);
                    const savedTick = localStorage.getItem('pikmin_global_tick');
                    if (savedTick) globalTick.value = parseInt(savedTick);
                    if ('Notification' in window) permissionStatus.value = Notification.permission;
                    setInterval(updateTimers, 1000);
                    if ('serviceWorker' in navigator) {
                        const base = window.location.pathname.split('/').slice(0, -1).join('/') + '/';
                        navigator.serviceWorker.register(base + 'sw.js', { scope: base });
                    }
                    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});
                });

                return { 
                    globalTick, form, mushrooms, sortedMushrooms, permissionStatus, iconSvg,
                    currentTimeDisplay, addMushroom, deleteMushroom, requestPermission, 
                    testNotification, handleTickInput, handleTickBlur 
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
