<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pikmin Bloom 蘑菇計時器</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="皮克敏計時">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3579/3579186.png">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍄</text></svg>">
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdfa 100%);
            min-height: 100vh;
        }
        /* 防止 Vue 載入失敗導致永久空白，加入一個 0.5s 後自動顯示的機制 */
        [v-cloak] { display: none; }
        .card-shadow { box-shadow: 0 10px 30px -10px rgba(7, 89, 133, 0.15); }
        @supports (padding: env(safe-area-inset-top)) {
            .safe-pt { padding-top: env(safe-area-inset-top); }
            .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
        }
    </style>
</head>
<body class="safe-pb text-slate-900">
    <div id="app" v-cloak class="max-w-md mx-auto p-5 safe-pt">
        
        <!-- Header -->
        <header class="mb-6">
            <h1 class="text-2xl font-900 text-blue-900 mb-4 flex items-center gap-2">
                <span class="text-3xl">🍄</span> Pikmin Bloom 計時器
            </h1>
            
            <div class="flex items-center justify-between bg-white/80 backdrop-blur-md rounded-3xl p-4 border border-blue-100 shadow-sm">
                <div class="flex flex-col">
                    <span class="text-[11px] font-black text-blue-800/50 uppercase tracking-widest">目前系統時間</span>
                    <span class="text-2xl font-mono font-900 text-blue-900 leading-none">{{ currentTimeDisplay }}</span>
                </div>
                <button 
                    @click="requestPermission"
                    :class="permissionStatus === 'granted' ? 'bg-blue-100/50 text-blue-700 border-blue-200' : 'bg-blue-600/90 text-white shadow-lg shadow-blue-200'"
                    class="px-5 py-2.5 rounded-2xl text-xs font-black transition-all active:scale-95 border backdrop-blur-sm"
                >
                    {{ permissionStatus === 'granted' ? '🔔 已開啟' : '🔔 開啟通知' }}
                </button>
            </div>
        </header>

        <!-- Form Section -->
        <section class="bg-white rounded-[2.5rem] p-6 mb-8 card-shadow border border-blue-100">
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-900 text-blue-900 mb-2 ml-1 uppercase">蘑菇地點</label>
                    <input v-model="form.name" type="text" placeholder="例如：大安森林公園..." 
                        class="w-full border-2 border-blue-50 bg-blue-50/50 rounded-2xl px-4 py-3.5 focus:ring-4 focus:ring-blue-100 focus:border-blue-400 focus:bg-white outline-none transition-all placeholder:text-blue-300 font-bold text-blue-900">
                </div>
                
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-900 text-blue-900 mb-2 ml-1">剩餘分鐘</label>
                        <input v-model.number="form.min" type="number" 
                            class="w-full border-2 border-blue-50 bg-blue-50/50 rounded-2xl px-4 py-3.5 outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400 text-xl font-900 text-blue-900">
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-900 text-blue-900 mb-2 ml-1">剩餘秒數</label>
                        <input v-model.number="form.sec" type="number" 
                            class="w-full border-2 border-blue-50 bg-blue-50/50 rounded-2xl px-4 py-3.5 outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400 text-xl font-900 text-blue-900">
                    </div>
                </div>

                <div class="flex items-center justify-between pt-2 bg-blue-50/40 p-4 rounded-2xl">
                    <div class="flex flex-col ml-1">
                        <span class="text-xs font-900 text-blue-800 uppercase">提前通知 (秒)</span>
                        <input v-model.number="form.advance" type="number" class="w-16 bg-transparent border-b-2 border-blue-200 text-center font-900 py-1 outline-none focus:border-blue-600 text-blue-900">
                    </div>
                    <label class="flex items-center cursor-pointer group">
                        <span class="mr-3 text-sm font-900 text-blue-900">通知開關</span>
                        <div class="relative inline-block w-12 align-middle select-none">
                            <input v-model="form.notify" type="checkbox" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-slate-200 appearance-none cursor-pointer right-6 checked:right-0 checked:border-blue-600 transition-all duration-300 shadow-sm"/>
                            <label class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-200 cursor-pointer"></label>
                        </div>
                    </label>
                </div>

                <button @click="addMushroom" class="w-full bg-blue-600/90 hover:bg-blue-600 text-white font-900 py-4 rounded-2xl transition-all transform active:scale-[0.98] shadow-lg shadow-blue-200 mt-2 tracking-widest text-lg">
                    開始計時
                </button>
            </div>
        </section>

        <!-- Timer List -->
        <div class="space-y-4">
            <div class="flex justify-between items-center px-4">
                <h2 class="text-xs font-900 text-blue-900/40 uppercase tracking-[0.2em]">清單 ({{ mushrooms.length }})</h2>
                <span class="text-[10px] text-teal-600 font-black">⚡ 重生中優先排序</span>
            </div>
            
            <transition-group name="list" tag="div" class="space-y-4">
                <div v-for="m in sortedMushrooms" :key="m.id" 
                    :class="m.phase === 2 ? 'border-teal-200 bg-white ring-2 ring-teal-500/10' : 'border-blue-100 bg-white/80'"
                    class="rounded-[2.5rem] p-6 border-2 card-shadow relative overflow-hidden transition-all duration-500">
                    
                    <div class="flex justify-between items-start relative z-10">
                        <div>
                            <h3 class="font-900 text-blue-950 text-xl leading-tight">{{ m.name || '未命名蘑菇' }}</h3>
                            <div class="flex gap-2 mt-2">
                                <span :class="m.phase === 2 ? 'bg-teal-500' : 'bg-blue-500'" class="text-white text-[10px] px-3 py-1 rounded-full uppercase font-black shadow-sm">
                                    {{ m.phase === 1 ? '⚔️ 戰鬥中' : '✨ 即將重生' }}
                                </span>
                            </div>
                        </div>
                        <button @click="deleteMushroom(m.id)" class="text-slate-300 hover:text-red-500 p-2 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>

                    <div class="flex items-baseline gap-2 mb-5 relative z-10 mt-3">
                        <span class="text-5xl font-900 tabular-nums tracking-tighter" :class="m.phase === 2 ? 'text-teal-600' : 'text-blue-600'">{{ m.displayTime }}</span>
                        <span class="text-sm font-900 text-slate-400">
                            {{ m.phase === 1 ? '後結束' : '後重生' }}
                        </span>
                    </div>

                    <!-- 8s Tick Anchor -->
                    <div v-if="m.phase === 2 && !m.isExpired" class="bg-teal-50 rounded-3xl p-4 border border-teal-100 relative z-10 shadow-inner">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="flex h-2 w-2 rounded-full bg-teal-400 animate-ping"></span>
                            <span class="text-[11px] font-900 text-teal-800 uppercase tracking-widest">地圖刷新對齊</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-white rounded-2xl py-3 px-4 shadow-sm border border-teal-100">
                                <p class="text-[10px] font-black text-teal-500 uppercase mb-1">下次刷新</p>
                                <p class="font-mono font-900 text-base text-teal-800">{{ m.nextTick }}</p>
                            </div>
                            <div class="bg-white rounded-2xl py-3 px-4 shadow-sm border border-teal-100">
                                <p class="text-[10px] font-black text-slate-400 uppercase mb-1">再下次</p>
                                <p class="font-mono font-900 text-base text-slate-500">{{ m.nextNextTick }}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Progress Bar -->
                    <div class="absolute bottom-0 left-0 h-2.5 bg-slate-100 w-full overflow-hidden">
                        <div :class="m.phase === 2 ? 'bg-teal-500' : 'bg-blue-500'" 
                             class="h-full transition-all duration-1000" 
                             :style="{ width: m.progress + '%' }">
                        </div>
                    </div>

                    <!-- Expired Mask -->
                    <div v-if="m.isExpired" class="absolute inset-0 bg-white/95 backdrop-blur-md flex items-center justify-center z-20">
                        <div class="text-center">
                            <p class="text-teal-700 font-900 text-xl mb-4">🍄 重生完成！</p>
                            <button @click="deleteMushroom(m.id)" class="text-sm font-900 bg-blue-600 text-white px-8 py-3 rounded-2xl shadow-lg active:scale-95">移除紀錄</button>
                        </div>
                    </div>
                </div>
            </transition-group>
        </div>
    </div>

    <style>
        .toggle-checkbox:checked { right: 0; border-color: #2563eb; }
        .toggle-checkbox:checked + .toggle-label { background-color: #2563eb; }
        .list-enter-active, .list-leave-active { transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .list-enter-from, .list-leave-to { opacity: 0; transform: scale(0.9) translateY(20px); }
        .list-move { transition: transform 0.6s ease; }
    </style>

    <script>
        const { createApp, ref, onMounted, onUnmounted, computed } = Vue;

        const app = createApp({
            setup() {
                const mushrooms = ref([]);
                const permissionStatus = ref('default');
                const currentTime = ref(new Date());
                const form = ref({ name: '', min: 0, sec: 0, notify: true, advance: 30 });

                // 安全地獲取通知狀態，防止 Safari 報錯
                const updatePermissionStatus = () => {
                    if (typeof Notification !== 'undefined') {
                        permissionStatus.value = Notification.permission;
                    }
                };

                const currentTimeDisplay = computed(() => {
                    const d = currentTime.value;
                    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
                });

                const playBeep = (freq = 880) => {
                    try {
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const oscillator = audioCtx.createOscillator();
                        const gainNode = audioCtx.createGain();
                        oscillator.connect(gainNode);
                        gainNode.connect(audioCtx.destination);
                        oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                        oscillator.start();
                        oscillator.stop(audioCtx.currentTime + 0.3);
                    } catch (e) {}
                };

                const requestPermission = async () => {
                    if (typeof Notification !== 'undefined') {
                        const result = await Notification.requestPermission();
                        permissionStatus.value = result;
                    }
                    playBeep(440);
                };

                const sendNotification = (title, body) => {
                    if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
                        navigator.serviceWorker.ready.then(reg => {
                            reg.showNotification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/3579/3579186.png' });
                        });
                    }
                    playBeep(880);
                };

                const setupWakeLock = async () => {
                    if ('wakeLock' in navigator) {
                        try { await navigator.wakeLock.request('screen'); } catch (err) {}
                    }
                };

                const addMushroom = () => {
                    const battleDurationMs = (form.value.min * 60 + form.value.sec) * 1000;
                    if (battleDurationMs <= 0 && !form.value.name) return;
                    const now = Date.now();
                    mushrooms.value.push({
                        id: now,
                        name: form.value.name || '未命名',
                        battleEndTime: now + battleDurationMs,
                        respawnEndTime: now + battleDurationMs + 300000,
                        advanceSeconds: form.value.advance,
                        notify: form.value.notify,
                        battleNotified: false, respawnNotified: false,
                        phase: 1, isExpired: false
                    });
                    saveData();
                    form.value.name = ''; form.value.min = 0; form.value.sec = 0;
                };

                const deleteMushroom = (id) => {
                    mushrooms.value = mushrooms.value.filter(m => m.id !== id);
                    saveData();
                };

                const saveData = () => {
                    localStorage.setItem('pikmin_v7', JSON.stringify(mushrooms.value));
                };

                const sortedMushrooms = computed(() => {
                    return [...mushrooms.value].sort((a, b) => {
                        if (a.isExpired !== b.isExpired) return a.isExpired ? 1 : -1;
                        if (a.phase !== b.phase) return b.phase - a.phase;
                        const at = a.phase === 1 ? a.battleEndTime : a.respawnEndTime;
                        const bt = b.phase === 1 ? b.battleEndTime : b.respawnEndTime;
                        return at - bt;
                    });
                });

                const formatTime = (ms) => {
                    const s = Math.max(0, Math.floor(ms / 1000));
                    return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
                };

                const formatTs = (ts) => {
                    const d = new Date(ts);
                    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
                };

                const updateTimers = () => {
                    const now = Date.now();
                    currentTime.value = new Date();
                    mushrooms.value.forEach(m => {
                        if (now < m.battleEndTime) {
                            m.phase = 1;
                            m.displayTime = formatTime(m.battleEndTime - now);
                            m.progress = ((m.battleEndTime - now) / (m.battleEndTime - m.id)) * 100;
                            if (m.notify && !m.battleNotified && (m.battleEndTime - now) < 1000) {
                                sendNotification(`⚔️ 戰鬥結束`, `${m.name} 進入重生倒數`);
                                m.battleNotified = true;
                            }
                        } else if (now < m.respawnEndTime) {
                            m.phase = 2;
                            const diff = m.respawnEndTime - now;
                            m.displayTime = formatTime(diff);
                            m.progress = (diff / 300000) * 100;
                            const nextTickTs = now + (diff % 8000);
                            m.nextTick = formatTs(nextTickTs);
                            m.nextNextTick = formatTs(nextTickTs + 8000);
                            if (m.notify && !m.respawnNotified && diff <= (m.advanceSeconds * 1000)) {
                                sendNotification(`🍄 重生預警`, `${m.name} 即將重生！`);
                                m.respawnNotified = true;
                            }
                        } else {
                            m.isExpired = true;
                        }
                    });
                };

                onMounted(() => {
                    try {
                        const saved = localStorage.getItem('pikmin_v7');
                        if (saved) mushrooms.value = JSON.parse(saved);
                        updatePermissionStatus();
                        setInterval(updateTimers, 1000);
                        
                        if ('serviceWorker' in navigator) {
                            const base = window.location.pathname.split('/').slice(0, -1).join('/') + '/';
                            navigator.serviceWorker.register(base + 'sw.js', { scope: base });
                        }
                        setupWakeLock();
                    } catch (e) { console.error("Vue Mount Error:", e); }
                });

                return {
                    form, mushrooms, sortedMushrooms, permissionStatus, currentTimeDisplay,
                    addMushroom, deleteMushroom, requestPermission
                };
            }
        });
        
        app.mount('#app');
    </script>
</body>
</html>
